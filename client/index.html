    function App() {
      const [lang, setLang] = useState("en");
      
      // Navigation History Stack Management
      const [currentView, setCurrentView] = useState("home"); // 'home' | 'restaurant' | 'farmer'
      const [history, setHistory] = useState(["home"]);
      const [historyIndex, setHistoryIndex] = useState(0);

      const [currentUser, setCurrentUser] = useState(null); // active role context
      const [restaurantTab, setRestaurantTab] = useState("order"); // 'order' | 'tracker' | 'recurring' | 'invoices' | 'notifications'
      const [farmerTab, setFarmerTab] = useState("inventory"); // 'inventory' | 'requests' | 'calendar' | 'earnings' | 'notifications'
      
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authRole, setAuthRole] = useState("restaurant");
      const [isSignUp, setIsSignUp] = useState(false);

      // State stores
      const [produceList, setProduceList] = useState(INDIAN_PRODUCE);
      const [orders, setOrders] = useState([]);
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState("All");
      const [orderTimeSlot, setOrderTimeSlot] = useState("11:00 AM - 1:00 PM (Lunch Prep Window)");
      const [orderDeliveryDate, setOrderDeliveryDate] = useState("Tomorrow");
      const [checkoutModalOpen, setCheckoutModalOpen] = useState(false);

      // Active Stock Edit Modal State
      const [editingStockItem, setEditingStockItem] = useState(null);

      // Role Notifications
      const [restaurantNotifications, setRestaurantNotifications] = useState([]);

      const [farmerNotifications, setFarmerNotifications] = useState([]);

      // Recurring orders
      const [recurringOrders, setRecurringOrders] = useState([]);

      const [signInRole, setSignInRole] = useState(null); // null | "restaurant" | "farmer"
      // Supply Redundancy Plan is optional: the restaurant chooses it per order (off by default)
      const [useRedundancy, setUseRedundancy] = useState(false);

      const t = TRANSLATIONS[lang] || TRANSLATIONS.en;

      // Wipe all session data so every sign-in starts completely fresh
      const resetSessionData = () => {
        setCart([]);
        setOrders([]);
        setRestaurantNotifications([]);
        setFarmerNotifications([]);
        setRecurringOrders([]);
        setProduceList(INDIAN_PRODUCE);
        setRestaurantTab("order");
        setFarmerTab("inventory");
        setOrderDeliveryDate("Tomorrow");
        setOrderTimeSlot("11:00 AM - 1:00 PM (Lunch Prep Window)");
        setUseRedundancy(false);
        setCheckoutModalOpen(false);
        setEditingStockItem(null);
      };

      // A portal can only be opened by someone signed in with that role
      const canOpenView = (view, user = currentUser) => {
        if (view === 'home') return true;
        return !!user && user.role === view;
      };

      // History-aware Navigation Function
      const navigateTo = (view) => {
        if (!canOpenView(view)) {
          setSignInRole(view); // ask them to sign in first
          return;
        }
        const newHistory = history.slice(0, historyIndex + 1);
        newHistory.push(view);
        setHistory(newHistory);
        setHistoryIndex(newHistory.length - 1);
        setCurrentView(view);
      };

      const goBack = () => {
        if (historyIndex > 0) {
          const newIdx = historyIndex - 1;
          const targetView = history[newIdx];
          setHistoryIndex(newIdx);
          setCurrentView(canOpenView(targetView) ? targetView : 'home');
        }
      };

      const goForward = () => {
        if (historyIndex < history.length - 1) {
          const newIdx = historyIndex + 1;
          const targetView = history[newIdx];
          setHistoryIndex(newIdx);
          setCurrentView(canOpenView(targetView) ? targetView : 'home');
        }
      };

      // Sign in with the name the person typed: brand-new, empty account
      const handleSignInSuccess = ({ name, email }) => {
        const role = signInRole;
        const cleanName = name.trim();
        const user = role === 'restaurant'
          ? { id: `usr_rest_${Date.now()}`, role, name: cleanName, email, organization: `${cleanName}'s Kitchen` }
          : { id: `usr_farm_${Date.now()}`, role, name: cleanName, email, organization: `${cleanName}'s Farm`, totalEarnings: 0, onTimeRate: null };
        resetSessionData();
        setCurrentUser(user);
        setSignInRole(null);
        const newHistory = history.slice(0, historyIndex + 1);
        newHistory.push(role);
        setHistory(newHistory);
        setHistoryIndex(newHistory.length - 1);
        setCurrentView(role);
      };

      const handleSignOut = () => {
        setCurrentUser(null);
        resetSessionData();
        const newHistory = history.slice(0, historyIndex + 1);
        newHistory.push('home');
        setHistory(newHistory);
        setHistoryIndex(newHistory.length - 1);
        setCurrentView('home');
      };

      // Cart Helpers
      const addToCart = (prod) => {
        setCart(prev => {
          const exists = prev.find(item => item.produceId === prod.id);
          if (exists) {
            return prev.map(item => item.produceId === prod.id ? { ...item, qty: item.qty + 5 } : item);
          }
          return [...prev, { produceId: prod.id, name: prod.name, qty: 10, unit: prod.unit, price: prod.farmPrices[0].price }];
        });
      };

      const updateCartQty = (prodId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.produceId === prodId) {
            const newQ = Math.max(1, item.qty + delta);
            return { ...item, qty: newQ };
          }
          return item;
        }).filter(item => item.qty > 0));
      };

      const removeFromCart = (prodId) => {
        setCart(prev => prev.filter(item => item.produceId !== prodId));
      };

      const cartTotal = useMemo(() => {
        return cart.reduce((sum, item) => sum + (item.qty * item.price), 0);
      }, [cart]);

      // Allocation preview: depends on whether the user chose the Supply Redundancy Plan
      const matchingPreview = useMemo(() => {
        if (!cart.length) return null;

        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        const total = Math.round(cartTotal * 100) / 100;

        if (!useRedundancy) {
          return {
            redundant: false,
            primaryFarm: {
              name: "Sahyadri Agro Producer Co.",
              distance: "12 km (Junnar)",
              sharePercent: "100%",
              allocatedQty: `${totalQty} kg`,
              status: "Primary Supplier Confirmed"
            },
            secondaryFarm: null,
            standbyFarm: null,
            totalAmount: total,
            routeSummary: "Direct Van: Sahyadri Agro -> Single Kitchen Delivery"
          };
        }

        const split1Qty = Math.ceil(totalQty * 0.6);
        const split2Qty = totalQty - split1Qty;

        return {
          redundant: true,
          primaryFarm: {
            name: "Sahyadri Agro Producer Co.",
            distance: "12 km (Junnar)",
            sharePercent: "60%",
            allocatedQty: `${split1Qty} kg`,
            status: "Primary Supplier Confirmed"
          },
          secondaryFarm: {
            name: "Godavari Fresh Farms",
            distance: "18 km (Nashik)",
            sharePercent: "40%",
            allocatedQty: `${split2Qty} kg`,
            status: "Secondary Supplier Confirmed"
          },
          standbyFarm: {
            name: "Maharashtra Krishi FPC",
            distance: "22 km (Narayangaon)",
            status: "100% Reserve Buffer on Standby"
          },
          totalAmount: total,
          routeSummary: "Consolidated Eco-Van: Sahyadri Agro -> Godavari Fresh -> Single Kitchen Delivery"
        };
      }, [cart, cartTotal, useRedundancy]);

    // =========================================================================
    // SIGN IN MODAL (DEMO CREDENTIALS PRE-FILLED)
    // =========================================================================
    function SignInModal({ role, t, onClose, onSuccess }) {
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        const validEmail = /^\S+@\S+\.\S+$/.test(email.trim());
        if (!name.trim() || !validEmail || !password) {
          setError(t.nav.signInError);
          return;
        }
        onSuccess({ name: name.trim(), email: email.trim().toLowerCase() });
      };

      const inputCls = "mt-1 w-full px-3 py-2 rounded-lg border border-earth-300 bg-white text-sm";

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4" onClick={onClose}>
          <form onSubmit={handleSubmit} onClick={(e) => e.stopPropagation()} className="w-full max-w-sm bg-[#FAF7F2] rounded-2xl border border-earth-300 shadow-xl p-6 space-y-4">
            <h2 className="font-serif text-2xl font-bold text-forest-950">
              {role === 'restaurant' ? t.nav.signInRestaurant : t.nav.signInFarmer}
            </h2>
            <p className="text-xs text-earth-600">{t.nav.demoNote}</p>
            <label className="block text-xs font-semibold text-forest-900">
              {t.nav.nameLabel}
              <input type="text" autoFocus autoComplete="name" value={name} placeholder={t.nav.namePlaceholder} onChange={(e) => { setName(e.target.value); setError(""); }} className={inputCls} />
            </label>
            <label className="block text-xs font-semibold text-forest-900">
              {t.nav.email}
              <input type="email" autoComplete="email" value={email} placeholder={t.nav.emailPlaceholder} onChange={(e) => { setEmail(e.target.value); setError(""); }} className={inputCls} />
            </label>
            <label className="block text-xs font-semibold text-forest-900">
              {t.nav.password}
              <input type="password" autoComplete="current-password" value={password} placeholder={t.nav.passwordPlaceholder} onChange={(e) => { setPassword(e.target.value); setError(""); }} className={inputCls} />
            </label>
            {error && <p className="text-xs text-red-700">{error}</p>}
            <div className="flex gap-3 pt-1">
              <button type="submit" className="flex-1 px-4 py-2.5 rounded-lg bg-forest-800 hover:bg-forest-900 text-earth-50 text-xs font-bold">{t.nav.signInBtn}</button>
              <button type="button" onClick={onClose} className="px-4 py-2.5 rounded-lg border border-earth-300 text-xs font-semibold">{t.nav.cancel}</button>
            </div>
          </form>
        </div>
      );
    }

    // =========================================================================
    // FARMER DASHBOARD VIEW (WORKING PHOTO UPLOAD WITH FILTER/CROP & EDIT STOCK)
    // =========================================================================
    function FarmerDashboardView({
      user,
      activeTab,
      setActiveTab,
      orders,
      produceList,
      notifications,
      setNotifications,
      onAddProduce,
      onEditStockItem,
      onAdvanceStatus
    }) {
      const [newItemName, setNewItemName] = useState("");
      const [newItemCategory, setNewItemCategory] = useState("Vine Produce");
      const [newItemPrice, setNewItemPrice] = useState("");
      const [newItemStock, setNewItemStock] = useState("");
      const [newItemUnit, setNewItemUnit] = useState("kg");

      // Photo upload state with filter & crop
      const [uploadedPhotoUrl, setUploadedPhotoUrl] = useState(null);
      const [photoFilter, setPhotoFilter] = useState("none"); // 'none' | 'vibrant' | 'warm' | 'crisp'
      const [cropAspect, setCropAspect] = useState("square"); // 'square' | 'landscape'

      const myListings = produceList.filter(p => p.farmPrices.some(fp => fp.farmerId === user.id));
      const myOrders = orders.filter(o => o.contributingFarmers?.some(cf => cf.farmName === user.organization || cf.farmerId === user.id));

      const handlePhotoSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            setUploadedPhotoUrl(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddCrop = (e) => {
        e.preventDefault();
        if (!newItemName || !newItemPrice || !newItemStock) return;

        const fallbackUrl = "https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&w=600&q=80";
        const finalPhotoUrl = uploadedPhotoUrl || fallbackUrl;

        const newCrop = {
          id: `prod_${Date.now()}`,
          name: newItemName,
          category: newItemCategory,
          unit: newItemUnit,
          description: "Freshly cultivated regional harvest at peak ripeness.",
          imageUrl: finalPhotoUrl,
          farmPrices: [
            {
              farmerId: user.id,
              farmName: user.organization,
              price: Number(newItemPrice),
              stock: Number(newItemStock),
              harvestReady: "Ready for Harvest",
              distance: "12 km"
            }
          ]
        };

        onAddProduce(newCrop);
        setNewItemName("");
        setNewItemPrice("");
        setNewItemStock("");
        setUploadedPhotoUrl(null);
        alert(`Successfully listed ${newCrop.name} in regional network marketplace!`);
      };

      const unreadCount = notifications.filter(n => !n.read).length;

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">

            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold uppercase tracking-wider text-forest-700">Grower Operations</span>
                <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold">Certified Organic Cluster</span>
              </div>
              <h2 className="font-serif text-3xl font-bold text-forest-950 mt-0.5">Welcome, {user.name}</h2>
              <p className="text-xs text-earth-600">{user.organization} • {user.email}</p>
            </div>

            {/* FARMER SUB-NAV */}

                onClick={() => setActiveTab("inventory")} 
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'inventory' ? 'bg-forest-800 text-white shadow-sm' : 'text-forest-900 hover:bg-earth-300/50'}`}
              >
                Crop Inventory
              </button>
              <button 
                onClick={() => setActiveTab("requests")} 
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'requests' ? 'bg-forest-800 text-white shadow-sm' : 'text-forest-900 hover:bg-earth-300/50'}`}
              >
                Matched Requests ({myOrders.length})
              </button>
              <button 
                onClick={() => setActiveTab("calendar")} 
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'calendar' ? 'bg-forest-800 text-white shadow-sm' : 'text-forest-900 hover:bg-earth-300/50'}`}
              >
                Delivery Calendar
              </button>
              <button 
                onClick={() => setActiveTab("earnings")} 
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'earnings' ? 'bg-forest-800 text-white shadow-sm' : 'text-forest-900 hover:bg-earth-300/50'}`}
              >
                Earnings & Direct Payouts
              </button>
              <button 
                onClick={() => setActiveTab("notifications")} 
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition relative ${activeTab === 'notifications' ? 'bg-forest-800 text-white shadow-sm' : 'text-forest-900 hover:bg-earth-300/50'}`}
              >

                {unreadCount > 0 && (
                  <span className="ml-1.5 px-1.5 py-0.2 bg-amber-600 text-white rounded-full text-[10px] font-bold">
                    {unreadCount}
                  </span>
                )}
              </button>
            </div>
          </div>

          {/* TAB 1: CROP INVENTORY & WORKING PHOTO UPLOAD WITH FILTER/CROP */}

            <div className="mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
              {/* LISTINGS TABLE */}

                <div className="bg-white rounded-2xl border border-earth-200 p-6 shadow-sm">

                  <div className="space-y-4">
                    {myListings.length === 0 && (
                      <div className="py-8 text-center text-xs text-earth-500">You have not listed any crops yet. Add your first harvest listing.</div>

                      const myPrice = item.farmPrices.find(fp => fp.farmerId === user.id);
                      return (
                        <div key={item.id} className="p-4 rounded-xl border border-earth-200 bg-earth-50 flex flex-wrap items-center justify-between gap-4">

                            <img src={item.imageUrl} alt={item.name} className="w-14 h-14 rounded-lg object-cover" />

                              <div className="font-bold text-forest-900 text-sm">{item.name}</div>

                        className="w-full text-xs p-2.5 rounded-lg border border-earth-300 bg-earth-50"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-bold text-earth-800 block mb-1">Category</label>
                      <select 
                        value={newItemCategory}
                        onChange={e => setNewItemCategory(e.target.value)}
                        className="w-full text-xs p-2.5 rounded-lg border border-earth-300 bg-earth-50"
                      >
                        <option value="Vine Produce">Vine Produce</option>
                        <option value="Leafy Greens">Leafy Greens</option>
                        <option value="Root Vegetables">Root Vegetables</option>
                        <option value="Herbs & Seasoning">Herbs & Seasoning</option>
                      </select>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="text-xs font-bold text-earth-800 block mb-1">Price (₹)</label>
                        <input

                          step="0.5"

                                type="button" 
                                onClick={() => setCropAspect("square")} 
                                className={`px-2 py-0.5 rounded text-[10px] font-bold ${cropAspect === 'square' ? 'bg-forest-800 text-white' : 'bg-earth-200'}`}
                              >
                                Square (1:1)
                              </button>
                              <button 
                                type="button" 
                                onClick={() => setCropAspect("landscape")} 
                                className={`px-2 py-0.5 rounded text-[10px] font-bold ${cropAspect === 'landscape' ? 'bg-forest-800 text-white' : 'bg-earth-200'}`}
                              >
                                4:3
                              </button>
                            </div>
                          </div>

                          <div className={`overflow-hidden rounded-lg border border-earth-300 w-full ${cropAspect === 'square' ? 'aspect-square' : 'aspect-[4/3]'}`}>
                            <img 
                              src={uploadedPhotoUrl} 
                              alt="Upload preview" 
                              className="w-full h-full object-cover transition-all"
                              style={{
                                filter: photoFilter === 'vibrant' ? 'saturate(1.3) contrast(1.05)' :
                                        photoFilter === 'warm' ? 'sepia(0.2) saturate(1.2)' :
                                        photoFilter === 'crisp' ? 'contrast(1.15) brightness(1.02)' : 'none'
                              }}
                            />
                          </div>

                          {/* Filter Presets */}
                          <div>
                            <span className="text-[10px] font-bold text-earth-700 block mb-1">Color Filter:</span>
                            <div className="grid grid-cols-4 gap-1">
                              {["none", "vibrant", "warm", "crisp"].map(flt => (
                                <button
                                  key={flt}
                                  type="button"
                                  onClick={() => setPhotoFilter(flt)}
                                  className={`py-1 rounded text-[10px] capitalize font-medium transition ${photoFilter === flt ? 'bg-forest-800 text-white font-bold' : 'bg-white border border-earth-300 text-earth-800'}`}
                                >
                                  {flt}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    <button type="submit" className="w-full py-2.5 rounded-xl bg-forest-800 hover:bg-forest-900 text-white font-bold text-xs mt-3 shadow transition">
                      + Add Harvest to Marketplace
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: MATCHED REQUESTS */}
          {activeTab === 'requests' && (
            <div className="mt-8 space-y-6">
              <div className="bg-white rounded-2xl border border-earth-200 p-6 shadow-sm">
                <h3 className="font-serif text-xl font-bold text-forest-950 mb-1">Matched Harvest Allocations</h3>
                <p className="text-xs text-earth-600 mb-6">Order quotas assigned to your farm by the network algorithm.</p>

                <div className="space-y-4">
                  {myOrders.length === 0 && (
                    <div className="py-8 text-center text-xs text-earth-500">No matched orders yet.</div>
                  )}
                  {myOrders.map(order => {
                    const myCut = order.contributingFarmers?.find(f => f.farmName === user.organization || f.farmerId === user.id);
                    return (
                      <div key={order.id} className="p-5 rounded-2xl bg-earth-50 border border-earth-300">
                        <div className="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-earth-200">
                          <div>
                            <span className="font-serif font-bold text-lg text-forest-950">Order #{order.id}</span>
                            <span className="text-xs text-earth-600 ml-2">Restaurant: <strong>{order.restaurantName}</strong></span>
                          </div>
                          <div className="flex items-center gap-2">
                            <button 
                              onClick={() => onAdvanceStatus(order.id)}
                              className="px-3.5 py-1.5 rounded-lg bg-forest-800 hover:bg-forest-900 text-white text-xs font-bold"
                            >
                              Confirm Morning Harvest Complete
                            </button>
                          </div>
                        </div>

                        <div className="mt-3 flex flex-wrap items-center justify-between text-xs gap-3">
                          <div>
                            <span className="font-semibold text-forest-800">Your Harvest Quota:</span>
                            <div className="text-earth-800 font-medium">{myCut?.items}</div>
                          </div>
                          <div className="text-right">
                            <span className="text-earth-500 block">Direct Net Payout:</span>
                            <span className="font-serif font-bold text-lg text-forest-950">₹{(myCut?.amount || 0).toFixed(2)}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: CALENDAR */}
          {activeTab === 'calendar' && (
            <div className="mt-8 space-y-6">
              <div className="bg-white rounded-2xl border border-earth-200 p-6 shadow-sm">
                <h3 className="font-serif text-xl font-bold text-forest-950 mb-1">Upcoming Harvest Commitments</h3>
                <p className="text-xs text-earth-600 mb-6">Scheduled pickup windows for the temperature-controlled route vehicles.</p>

                {myOrders.length === 0 ? (
                  <div className="py-8 text-center text-xs text-earth-500">No upcoming harvest commitments.</div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {myOrders.map(order => {
                      const myCut = order.contributingFarmers?.find(f => f.farmerId === user.id);
                      return (
                        <div key={order.id} className="p-4 rounded-xl border border-earth-300 bg-white">
                          <span className="text-xs font-bold text-earth-700 uppercase block mb-1">{order.deliveryDate}</span>
                          <h5 className="font-bold text-forest-950 text-sm">Order #{order.id}</h5>
                          <p className="text-xs text-earth-700 mt-1">{myCut?.items}</p>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TAB 4: EARNINGS & PAYOUTS */}
          {activeTab === 'earnings' && (
            <div className="mt-8 space-y-6">
              <div className="bg-white rounded-2xl border border-earth-200 p-6 shadow-sm">
                <div className="flex flex-wrap items-center justify-between pb-6 border-b border-earth-200 gap-4">
                  <div>
                    <h3 className="font-serif text-xl font-bold text-forest-950 mb-1">Farmer Earnings & Direct Disbursements</h3>
                    <p className="text-xs text-earth-600">Fair transparent payout: 95% net settlement deposited directly for every harvest fulfilled.</p>
                  </div>
                  <div className="text-xs font-bold text-emerald-800 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                    Direct Account Verified
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 my-6">
                  <div className="p-5 rounded-2xl bg-earth-50 border border-earth-200">
                    <span className="text-xs text-earth-600 block">Total Revenue Disbursed:</span>
                    <span className="font-serif text-3xl font-bold text-forest-950">₹{(user.totalEarnings || 0).toLocaleString()}</span>
                  </div>
                  <div className="p-5 rounded-2xl bg-earth-50 border border-earth-200">
                    <span className="text-xs text-earth-600 block">Pending Transit Settlement:</span>
                    <span className="font-serif text-3xl font-bold text-harvest-700">₹0.00</span>
                  </div>
                  <div className="p-5 rounded-2xl bg-earth-50 border border-earth-200">
                    <span className="text-xs text-earth-600 block">On-Time Fulfillment Rate:</span>
                    <span className="font-serif text-3xl font-bold text-emerald-700">{user.onTimeRate == null ? "—" : `${user.onTimeRate}%`}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 5: DEDICATED FARMER NOTIFICATIONS */}
          {activeTab === 'notifications' && (
            <div className="mt-8 space-y-6">
              <div className="bg-white rounded-2xl border border-earth-200 p-6 shadow-sm">
                <div className="flex items-center justify-between pb-4 border-b border-earth-200">
                  <div>
                    <h3 className="font-serif text-xl font-bold text-forest-950">Farmer Harvest & Payout Alerts</h3>
                    <p className="text-xs text-earth-600">Notifications regarding new order quotas, collection timings, and direct disbursements.</p>
                  </div>
                  <button 
                    onClick={() => setNotifications(prev => prev.map(n => ({ ...n, read: true })))}
                    className="text-xs font-semibold text-forest-800 hover:text-forest-950"
                  >
                    Mark All as Read
                  </button>
                </div>

                <div className="mt-6 space-y-3">
                  {notifications.map(n => (
                    <div key={n.id} className={`p-4 rounded-xl border transition ${n.read ? 'bg-earth-50/60 border-earth-200' : 'bg-white border-forest-300 shadow-sm'}`}>
                      <div className="flex items-center justify-between text-xs mb-1">
                        <span className="font-bold text-forest-900">{n.title}</span>
                        <span className="text-earth-500 text-[11px]">{n.time}</span>
                      </div>
                      <p className="text-xs text-earth-700 leading-relaxed">{n.message}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // EDIT STOCK MODAL (FIX FOR EDIT STOCK BUTTON)
    // =========================================================================
    function EditStockModal({ item, onClose, onSave, farmerId }) {
      const targetIndex = item.farmPrices.findIndex(fp => fp.farmerId === farmerId);
      const editIndex = targetIndex >= 0 ? targetIndex : 0;
      const primaryListing = item.farmPrices[editIndex] || {};
      const [stockQty, setStockQty] = useState(primaryListing.stock || 100);
      const [unitPrice, setUnitPrice] = useState(primaryListing.price || 35);
      const [harvestReady, setHarvestReady] = useState(primaryListing.harvestReady || "Ready for Harvest Today");

      const handleSave = (e) => {
        e.preventDefault();
        const updatedItem = {
          ...item,
          farmPrices: item.farmPrices.map((fp, i) => i === editIndex ? {
            ...fp,
            stock: Number(stockQty),
            price: Number(unitPrice),
            harvestReady: harvestReady
          } : fp)
        };
        onSave(updatedItem);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#FAF7F2] max-w-md w-full rounded-2xl p-6 shadow-2xl border border-earth-300">
            <div className="flex items-center justify-between pb-3 border-b border-earth-200">
              <h4 className="font-serif text-lg font-bold text-forest-950">Edit Inventory Stock</h4>
              <button onClick={onClose} className="text-earth-500 text-xl font-bold">&times;</button>
            </div>

            <form onSubmit={handleSave} className="mt-4 space-y-4">
              <div>
                <label className="text-xs font-bold text-earth-800 block mb-1">Produce Name</label>
                <div className="text-xs font-bold text-forest-900 p-2.5 bg-earth-100 rounded-lg border border-earth-200">
                  {item.name}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-bold text-earth-800 block mb-1">Available Quantity ({item.unit})</label>
                  <input 
                    type="number" 
                    required 
                    value={stockQty}
                    onChange={e => setStockQty(e.target.value)}
                    className="w-full text-xs p-2.5 rounded-lg border border-earth-300 bg-white focus:outline-none"
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-earth-800 block mb-1">Unit Price (₹)</label>
                  <input 
                    type="number" 
                    step="0.5" 
                    required 
                    value={unitPrice}
                    onChange={e => setUnitPrice(e.target.value)}
                    className="w-full text-xs p-2.5 rounded-lg border border-earth-300 bg-white focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs font-bold text-earth-800 block mb-1">Harvest-Ready Status</label>
                <select 
                  value={harvestReady}
                  onChange={e => setHarvestReady(e.target.value)}
                  className="w-full text-xs p-2.5 rounded-lg border border-earth-300 bg-white focus:outline-none"
                >
                  <option value="Ready for Harvest Today">Ready for Harvest Today</option>
                  <option value="Picked 6 AM Today">Picked 6 AM Today</option>
                  <option value="Ready Tomorrow Morning">Ready Tomorrow Morning</option>
                  <option value="Available on Call">Available on Call</option>
                  <option value="Low Stock (Cut to Order)">Low Stock (Cut to Order)</option>
                </select>
              </div>

              <div className="flex gap-2 pt-2">
                <button 
                  type="button" 
                  onClick={onClose} 
                  className="w-1/2 py-2.5 rounded-xl border border-earth-300 bg-white text-earth-800 font-semibold text-xs"
                >
                  Cancel
                </button>
                <button 
                  type="submit" 
                  className="w-1/2 py-2.5 rounded-xl bg-forest-800 hover:bg-forest-900 text-white font-bold text-xs shadow"
                >
                  Save Stock Updates
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // CHECKOUT MODAL
    // =========================================================================
    function CheckoutModal({ isOpen, onClose, cartTotal, matchingPreview, onComplete }) {
      const [isProcessing, setIsProcessing] = useState(false);

      const handleAuthorize = () => {
        setIsProcessing(true);
        setTimeout(() => {
          setIsProcessing(false);
          onComplete();
        }, 1000);
      };

      const platformFee = Math.round(cartTotal * 0.05 * 100) / 100;
      const netFarmerPool = Math.round((cartTotal - platformFee) * 100) / 100;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white max-w-lg w-full rounded-3xl p-7 shadow-2xl border border-earth-300">
            <div className="flex items-center justify-between pb-3 border-b border-earth-200">
              <h3 className="font-serif text-lg font-bold text-forest-950">Confirm & Authorize Order</h3>
              <button onClick={onClose} className="text-earth-500 hover:text-earth-900 text-xl font-bold">&times;</button>
            </div>

            <div className="my-5 space-y-4 text-xs">
              <div className="p-4 rounded-xl bg-earth-50 border border-earth-200 space-y-2">
                <div className="flex justify-between font-bold text-forest-950 text-sm">
                  <span>Total Order Value:</span>
                  <span>₹{cartTotal.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-earth-600 text-[11px]">
                  <span>Farmer Cluster Disbursement (95%):</span>
                  <span>₹{netFarmerPool.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-earth-600 text-[11px]">
                  <span>Logistics Coordination (5%):</span>
                  <span>₹{platformFee.toFixed(2)}</span>
                </div>
              </div>

              {/* Multi-Farm Split Preview */}
              {matchingPreview && (
                <div className="p-3.5 rounded-xl bg-forest-50 border border-forest-200 space-y-1.5">
                  <span className="font-bold text-forest-900 block text-[11px]">Direct Payout Splitting:</span>
                  <div className="flex justify-between text-[11px] text-earth-800">
                    <span>{matchingPreview.primaryFarm.name}</span>
                    <span className="font-mono font-semibold">₹{(netFarmerPool * (matchingPreview.secondaryFarm ? 0.6 : 1)).toFixed(2)}</span>
                  </div>
                  {matchingPreview.secondaryFarm && (
                    <div className="flex justify-between text-[11px] text-earth-800">
                      <span>{matchingPreview.secondaryFarm.name}</span>
                      <span className="font-mono font-semibold">₹{(netFarmerPool * 0.4).toFixed(2)}</span>
                    </div>
                  )}
                </div>
              )}

              <div className="p-3 bg-earth-100 rounded-xl text-[11px] text-earth-700">
                Payment Method: Corporate Kitchen Account / Direct Transfer
              </div>

              <button 
                onClick={handleAuthorize}
                disabled={isProcessing}
                className="w-full py-3.5 rounded-xl bg-forest-800 hover:bg-forest-900 text-white font-bold text-xs shadow-lg transition mt-4"
              >
                {isProcessing ? "Authorizing Order..." : `Confirm & Place Order (₹${cartTotal.toFixed(2)})`}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
